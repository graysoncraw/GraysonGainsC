<section class="page-section">
  <div class="section-heading">
    <p>Schedule</p>
    <h2>Set your training week</h2>
  </div>

  @if (error()) {
    <div class="status-banner error">{{ error() }}</div>
  }

  @if (success()) {
    <div class="status-banner success">{{ success() }}</div>
  }

  <div class="form-grid three-up">
    <label>
      <span>Cycle start date</span>
      <input type="date" [ngModel]="form().cycleStartDate" (ngModelChange)="updateField('cycleStartDate', $event)" />
    </label>

    <label>
      <span>Bench day</span>
      <select [ngModel]="form().benchDay" (ngModelChange)="updateField('benchDay', $event)">
        @for (day of days; track day) {
          <option [value]="day">{{ day }}</option>
        }
      </select>
    </label>

    <label>
      <span>Squat day</span>
      <select [ngModel]="form().squatDay" (ngModelChange)="updateField('squatDay', $event)">
        @for (day of days; track day) {
          <option [value]="day">{{ day }}</option>
        }
      </select>
    </label>

    <label>
      <span>Deadlift day</span>
      <select [ngModel]="form().deadliftDay" (ngModelChange)="updateField('deadliftDay', $event)">
        @for (day of days; track day) {
          <option [value]="day">{{ day }}</option>
        }
      </select>
    </label>

    <label>
      <span>Shoulder press day</span>
      <select [ngModel]="form().shoulderPressDay" (ngModelChange)="updateField('shoulderPressDay', $event)">
        @for (day of days; track day) {
          <option [value]="day">{{ day }}</option>
        }
      </select>
    </label>
  </div>

  <div class="button-row">
    <button type="button" class="primary-button" [disabled]="loading()" (click)="save()">
      {{ loading() ? 'Saving...' : 'Save schedule' }}
    </button>
  </div>
</section>
