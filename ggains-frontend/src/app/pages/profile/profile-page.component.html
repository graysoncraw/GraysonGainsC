<section class="page-section">
  <div class="section-heading">
    <p>Profile</p>
    <h2>Manage the backend user record</h2>
  </div>

  @if (error()) {
    <div class="status-banner error">{{ error() }}</div>
  }

  @if (success()) {
    <div class="status-banner success">{{ success() }}</div>
  }

  <div class="form-grid">
    <label>
      <span>First name</span>
      <input required [ngModel]="form().firstName" (ngModelChange)="updateField('firstName', $event)" />
    </label>

    <label>
      <span>Last name</span>
      <input required [ngModel]="form().lastName" (ngModelChange)="updateField('lastName', $event)" />
    </label>

    <label>
      <span>Email</span>
      <input type="email" required [ngModel]="form().email" (ngModelChange)="updateField('email', $event)" />
    </label>

    <label>
      <span>Gender</span>
      <select required [ngModel]="form().gender" (ngModelChange)="updateField('gender', $event)">
        <option value="" disabled>Select gender</option>
        @for (gender of genderOptions; track gender) {
          <option [value]="gender">{{ gender }}</option>
        }
      </select>
    </label>

    <label>
      <span>Height (ft)</span>
      <input type="number" min="0" step="1" required [ngModel]="form().heightFt" (ngModelChange)="updateNumberField('heightFt', $event)" />
    </label>

    <label>
      <span>Height (in)</span>
      <input type="number" min="0" max="11" step="1" required [ngModel]="form().heightIn" (ngModelChange)="updateNumberField('heightIn', $event)" />
    </label>

    <label>
      <span>Weight (lbs)</span>
      <input type="number" min="0.1" step="0.1" required [ngModel]="form().weight" (ngModelChange)="updateNumberField('weight', $event)" />
    </label>
  </div>

  <div class="button-row">
    <button type="button" class="primary-button" [disabled]="loading()" (click)="save()">
      {{ loading() ? 'Saving...' : 'Save profile' }}
    </button>
    @if (!onboardingMode()){
    <button type="button" class="secondary-button danger" [disabled]="deleting()" (click)="deleteAccount()">
      {{ deleting() ? 'Deleting...' : 'Delete profile' }}
    </button>
    }
  </div>
</section>
