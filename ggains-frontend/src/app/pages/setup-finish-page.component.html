<section class="page-section">
  <div class="section-heading">
    <p>Finalizing</p>
    <h2>Creating your first training cycle</h2>
  </div>

  <div class="status-banner">
    We’re waiting for the backend to finish creating your first cycle from your PRs and schedule.
  </div>

  @if (error()) {
    <div class="status-banner error">{{ error() }}</div>
  }

  <div class="button-row">
    <button type="button" class="primary-button" [disabled]="loading()" (click)="refresh()">
      {{ loading() ? 'Checking...' : 'Check again' }}
    </button>
  </div>
</section>
